name: VORA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-check:
    name: VORA Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/instruction-setup@v3
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd vora-backend
          npm ci || npm install

      - name: Build TypeScript Backend
        run: |
          cd vora-backend
          npm run build

  mobile-check:
    name: VORA Mobile App Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Mobile Dependencies
        run: |
          cd uber
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Validate Expo Config
        run: |
          cd uber
          npx expo config --type public
