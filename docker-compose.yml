# ============================================================================
#  VORA — Docker Compose (Backend + Frontend)
#
#  Utilisation :
#    docker compose up                 (démarrer les deux services)
#    docker compose up --build         (reconstruire et démarrer)
#    docker compose down               (arrêter)
# ============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vora-backend
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
    environment:
      - PORT=5000
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: vora-web
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./mobile/app:/app/app
      - ./mobile/components:/app/components
      - ./mobile/lib:/app/lib
      - ./mobile/store:/app/store
      - ./mobile/constants:/app/constants
      - ./mobile/assets:/app/assets
      - ./mobile/package.json:/app/package.json
      - ./mobile/package-lock.json:/app/package-lock.json
    environment:
      - EXPO_PUBLIC_BACKEND_URL=http://localhost:5000
      - EXPO_PUBLIC_SOCKET_URL=http://localhost:5000
      - EXPO_PUBLIC_PORT=8081
    restart: unless-stopped
